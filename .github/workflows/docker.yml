name: Docker image

on:
  push:
    branches: [main]
  pull_request:

# Builds the production image on every change, so a Dockerfile that has drifted
# from the app is caught here rather than during a deploy. It does not push
# anywhere — publishing needs a registry and credentials this repository does
# not have.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Layer cache in the Actions cache, so an unchanged package-lock.json
          # does not reinstall node_modules on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
